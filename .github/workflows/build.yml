name: Build Container

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/**'
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - 'src/**'
      - '.github/**'
  workflow_dispatch:

jobs:
  build-test-and-publish:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        dotnet-version: ['8.0.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore
        working-directory: src
        run: dotnet restore RandomQuotes.sln

      - name: Build
        working-directory: src
        run: dotnet build RandomQuotes.sln --configuration Release --no-restore

      - name: Test
        working-directory: src
        run: dotnet test RandomQuotes.sln --configuration Release --no-build

      - name: Install GitVersion
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: gittools/actions/gitversion/setup@v0.9.14
        with:
          versionSpec: 5.x

      - id: determine_version
        name: Determine Version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: gittools/actions/gitversion/execute@v0.9.14
        with:
          additionalArguments: /overrideconfig mode=Mainline

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_PAT_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Setup Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Build and push website container
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: src
        run: |
          docker buildx build \
            --push \
            --platform linux/amd64,linux/arm64 \
            -f "./RandomQuotes.Web/Dockerfile" \
            --tag ${{ secrets.DOCKERHUB_REPO }}:${{ env.GitVersion_SemVer }} \
            --tag ${{ secrets.DOCKERHUB_REPO }}:latest \
            .
